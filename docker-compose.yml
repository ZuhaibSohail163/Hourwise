name: hourwise

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hourwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hourwise}
      POSTGRES_DB: ${POSTGRES_DB:-hourwise}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hourwise} -d ${POSTGRES_DB:-hourwise}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # Set DATABASE_URL in .env to use a hosted Postgres (Neon, Supabase, RDS...) instead.
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-hourwise}:${POSTGRES_PASSWORD:-hourwise}@db:5432/${POSTGRES_DB:-hourwise}}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-168}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      UPLOAD_DIR: /data/uploads
      BIND_ADDR: 0.0.0.0:8080
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  pgdata:
  uploads:
