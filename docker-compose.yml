name: hourwise

# Database: the backend talks to Turso Cloud when TURSO_DATABASE_URL / TURSO_AUTH_TOKEN are set
# in .env. Without them it uses a local libSQL/SQLite file in the `dbdata` volume, so the stack
# runs fully offline for development. See README -> Database.

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-file:/data/db/hourwise.db}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-168}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCKOUT_SECS: ${LOGIN_LOCKOUT_SECS:-900}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      UPLOAD_DIR: /data/uploads
      BIND_ADDR: 0.0.0.0:8080
    volumes:
      - uploads:/data/uploads
      - dbdata:/data/db
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  uploads:
  dbdata:
