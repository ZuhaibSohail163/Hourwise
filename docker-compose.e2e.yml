# Isolated stack for the Playwright end-to-end tests (`npm run test:e2e`).
#
# - Separate compose project (`hourwise-e2e`) and ports (3100/8180), so it never touches the
#   development stack or its volumes.
# - PostgreSQL and uploads live on tmpfs: every run starts empty and nothing is left behind.
# - Credentials below are throwaway test values, not secrets.
name: hourwise-e2e

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: hourwise_e2e
      POSTGRES_PASSWORD: hourwise_e2e
      POSTGRES_DB: hourwise_e2e
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off"]
    tmpfs:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/18/docker and refuse a
      # mount at the old /var/lib/postgresql/data path.
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hourwise_e2e -d hourwise_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://hourwise_e2e:hourwise_e2e@db:5432/hourwise_e2e
      JWT_SECRET: e2e-only-secret-e2e-only-secret-e2e-only
      JWT_TTL_HOURS: "2"
      COOKIE_SECURE: "true"
      LOGIN_MAX_ATTEMPTS: "50"
      # Every browser shares the frontend's address here, so keep the per-IP limit high.
      LOGIN_MAX_ATTEMPTS_PER_IP: "500"
      ADMIN_EMAIL: e2e-admin@example.com
      ADMIN_PASSWORD: E2eAdminPass1
      ADMIN_NAME: E2E Admin
      UPLOAD_DIR: /data/uploads
    tmpfs:
      - /data/uploads:uid=10001
    ports:
      - "127.0.0.1:8180:8080"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:3000"
