name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (fmt + clippy + PostgreSQL tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Disposable PostgreSQL (tmpfs, marked hourwise.disposable=on). Each test creates and
      # drops its own database on it.
      - name: Start the disposable PostgreSQL test server
        run: docker compose -f ../docker-compose.test.yml -p hourwise-test up -d --wait
      - name: Unit + database + API + security tests
        run: cargo test --locked
        env:
          HOURWISE_TEST_DATABASE_URL: postgres://hourwise_test:hourwise_test@localhost:55432/postgres
      - run: cargo build --locked

  images:
    name: Production Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hourwise-backend ./backend
      - run: docker build --build-arg BACKEND_URL=http://backend:8080 -t hourwise-frontend ./frontend

  frontend:
    name: Frontend (prettier + eslint + tsc + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright, isolated Docker stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7
